[PATHS]
data_file = Data/FastFoodNutritionMenuV3.csv
temp_data_file = Data/temp_processed_data.csv

[DATA]
target_column = calories
test_size = 0.2
random_state = 42

[PREPROCESSING]
num_strategy = drop
cat_strategy = mode
dt_strategy = drop
scaling_strategy = standard
outlier_method = zscore
# Comma-separated list of feature names to drop before processing
drop_features = calories_from_fat,weight_watchers_pnts,company,item
# If true, clean/convert negative values to sensible defaults (e.g., abs or NaN handling)
clean_negative_values = true
# Categorical encoding strategy: onehot, ordinal, target, or none
categorical_encoding = onehot

[MODEL]
selected_models = all
available_models = RandomForest,LightGBM,Ridge,Lasso,ElasticNet,LinearRegression

[OPTIMIZATION]
enable_optimization = false
n_trials = 50
n_jobs = 3
models_to_optimize = RandomForest,LightGBM,Ridge,Lasso,ElasticNet

[VISUALIZATION]
enable_eda = true
enable_plots = true
feature_importance_top_n = 15

[OUTPUT]
results_csv = results/evaluation_results.csv
results_json = results/evaluation_results.json
comparison_plot = plots/comparison.png
importance_plot = plots/importance.png