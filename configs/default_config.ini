[PATHS]
data_file = data/raw/FastFoodNutritionMenuV3.csv
temp_data_file = data/interim/temp_processed_data.csv

[DATA]
target_column = saturated_fat_g
test_size = 0.2
random_state = 42

[PREPROCESSING]
num_strategy = drop
cat_strategy = drop
dt_strategy = drop
scaling_strategy = standard
outlier_method = zscore
drop_features =calories_from_fat,weight_watchers_pnts,company,item,total_fat_g,calories,trans_fat_g
clean_negative_values = true
categorical_encoding = onehot

[MODEL]
selected_models = all
available_models = ElasticNet,RandomForest,LightGBM,XGBoost,DecisionTree

[OPTIMIZATION]
enable_optimization = false
n_trials = 50
n_jobs = 3
models_to_optimize = ElasticNet,RandomForest,LightGBM,XGBoost,DecisionTree

[VISUALIZATION]
enable_eda = true
enable_plots = true
feature_importance_top_n = 15

[OUTPUT]
log_dir = outputs/logs
eda_before_path = outputs/plots/eda/before
eda_after_path = outputs/plots/eda/after
results_csv = outputs/results/evaluation_results.csv
results_json = outputs/results/evaluation_results.json
comparison_plot = outputs/plots/model_comparison.png
importance_plot = outputs/plots/feature_importance.png
models_dir = outputs/models